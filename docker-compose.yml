services:
  postgis-local:
    image: postgis/postgis:15-3.4
    container_name: postgis-local-compose
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - ${HOST_DATA_FILE_ROOT}/data/postgis-local:/var/lib/postgresql/data
    command: ["postgres"]

  pg-shell:
    build:
      context: .
      dockerfile: Dockerfile.pgshell
    container_name: pg-shell-compose
    # keep it from automatically restarting; you'll run it interactively with `docker compose run`
    restart: "no"
    environment:
      PGHOST: postgis-local
      PGPORT: 5432
      PGUSER: ${PGSHELL_USER}
      PGPASSWORD: ${PGSHELL_PASSWORD}
      # default DB used by psql/pgcli when none specified
      PGDATABASE: ${PGSHELL_DB}
    volumes:
      # mount scripts so you can edit them locally and use them from the shell
      - ./scripts:/opt/scripts:cached
      - ./zsh-custom:/root/.oh-my-zsh/custom:cached
      # optional: persist pgcli config between runs (change path if needed)
      - ~/.config/pgcli:/root/.config/pgcli
      # optional: mount your dotfiles if you want them available
      - ~/.ssh:/root/.ssh:ro
      # persist home directory between container rebuilds
      - pg-shell-home:/root
      # mount backups directory so scripts can write backups to the host
      - ${HOST_DATA_FILE_ROOT}/backups/postgis-local:/var/backups
    tty: true
    stdin_open: true
    # default entry to an interactive login zsh
    entrypoint: ["/usr/bin/zsh", "-l"]

volumes:
  pg-shell-home:
